name: news_app_clean_architecture
description: A news app built with Clean Architecture where journalists can publish their own articles.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1

  # Value equality for entities, events and states
  equatable: ^2.0.7

  # Service locator
  get_it: ^9.2.1

  # Date formatting
  intl: ^0.20.2

  # Local database (sqflite is imported directly by the generated Floor database)
  floor: ^1.5.0
  sqflite: ^2.4.0

  # HTTP client
  dio: ^5.7.0

  # Firebase
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_auth: ^6.0.0
  google_sign_in: ^7.1.0

  # Device-local settings
  shared_preferences: ^2.3.0

  # Cached images
  cached_network_image: ^3.4.0

  # Navigation with auth-aware redirects
  go_router: ^16.0.0

  # Skeleton loading
  shimmer: ^3.0.0

  # Photo picking for article thumbnails
  image_picker: ^1.1.2

  # Vector assets (Google mark)
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  # SingleChildWidget type for test helpers that build MultiBlocProvider
  provider: ^6.1.0
  # Runs the Floor database on the host during tests
  sqflite_common_ffi: ^2.3.0
  floor_generator: ^1.5.0
  build_runner: ^2.4.0
  # Native launch screen and launcher icon from the brand asset
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/brand/

  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/newsreader/Newsreader-Variable.ttf
        - asset: assets/fonts/newsreader/Newsreader-Italic-Variable.ttf
          style: italic
    - family: Mulish
      fonts:
        - asset: assets/fonts/mulish/Mulish-Variable.ttf
        - asset: assets/fonts/mulish/Mulish-Italic-Variable.ttf
          style: italic

flutter_native_splash:
  color: "#F7F3EC"
  color_dark: "#121416"
  image: assets/images/brand/headline_news.png
  android_12:
    color: "#F7F3EC"
    color_dark: "#121416"
    image: assets/images/brand/headline_news.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/brand/headline_news.png
  adaptive_icon_background: "#F7F3EC"
  adaptive_icon_foreground: assets/images/brand/headline_news.png

name: news_app_clean_architecture
description: A news app built with Clean Architecture where journalists can publish their own articles.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Icons
  ionicons: ^0.2.2

  # State management
  flutter_bloc: ^9.1.1

  # Value equality for entities, events and states
  equatable: ^2.0.7

  # Service locator
  get_it: ^9.2.1

  # Date formatting
  intl: ^0.20.2

  # Local database (sqflite is imported directly by the generated Floor database)
  floor: ^1.5.0
  sqflite: ^2.4.0

  # HTTP client
  dio: ^5.7.0

  # Firebase
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0

  # Hooks
  flutter_hooks: ^0.21.0

  # Cached images
  cached_network_image: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  floor_generator: ^1.5.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  fonts:
    - family: Muli
      fonts:
        - asset: assets/fonts/muli/Muli.ttf
        - asset: assets/fonts/muli/Muli-Bold.ttf
          weight: 700
        - asset: assets/fonts/muli/Muli-Light.ttf
          weight: 300
